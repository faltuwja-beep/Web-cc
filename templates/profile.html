{% extends "base.html" %}

{% block title %}
Profile - Prime Shop
{% endblock %}

{% block content %}

<div class="profile-card">

    <div class="profile-avatar">

        {{ user.username[0].upper() }}

    </div>

    <h1>

        {{ user.username }}

    </h1>

    <p>

        {{ user.email }}

    </p>

    <div class="profile-balance">

        Wallet Balance

        <strong>

            ₹{{ user.balance }}

        </strong>

    </div>

</div>

{% endblock %}
