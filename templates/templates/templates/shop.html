<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>YoYo Shop</title>
<style>
body { background: #0b0614; color: white; font-family: Arial; padding: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; background: #120b20; padding: 15px; border-radius: 12px; border: 1px solid #3e1e56; }
.wallet { background: #1d1230; padding: 8px 15px; border-radius: 20px; color: #ffd21c; font-weight: bold; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
.card { background: #130b20; border: 1px solid #3e1e56; padding: 20px; border-radius: 12px; text-align: center; }
.price { color: #ffd21c; font-size: 18px; font-weight: bold; margin: 10px 0; }
button { padding: 10px 20px; background: #38d46b; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; color: #07100a; }
.deposit-box { background: #120b20; padding: 20px; border-radius: 12px; margin-top: 30px; border: 1px solid #3e1e56; max-width: 400px; }
input { width: 100%; padding: 10px; margin: 8px 0; background: #09050f; border: 1px solid #492460; color: white; border-radius: 6px; }
</style>
</head>
<body>
<div class="header">
    <h3>🛒 Welcome, {{ username }}</h3>
    <div class="wallet">💰 Balance: ₹{{ balance }}</div>
    <a href="/logout" style="color: #ff9ba5;">Logout</a>
</div>

<h2>🛍️ Available Items (Redeem Codes & CC Cards)</h2>
<div class="grid">
    {% for p in products %}
    <div class="card">
        <h4>{{ p[1] }}</h4>
        <p style="color:#aaa; font-size:12px;">{{ p[4] }}</p>
        <div class="price">₹{{ p[3] }}</div>
        <button onclick="alert('Feature coming soon!')">Buy Now</button>
    </div>
    {% endfor %}
</div>

<div class="deposit-box">
    <h3>💳 Add Money via QR Code</h3>
    <p style="font-size:12px; color:#aaa;">Scan QR & pay, then submit UTR/Transaction ID below.</p>
    <div style="text-align: center; margin: 10px 0;">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=sunaina2012@fam" alt="QR Code" style="border-radius: 8px;">
    </div>
    <form action="/add-money" method="POST">
        <input type="number" name="amount" placeholder="Enter Amount Paid (₹)" required>
        <input type="text" name="utr" placeholder="Enter UTR / Transaction ID" required>
        <button type="submit" style="background:#ff9900; color:white; width:100%;">Submit Payment Proof</button>
    </form>
</div>
</body>
</html>
