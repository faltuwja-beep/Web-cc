<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Register - YoYo Shop</title>
<style>
body { background: #0b0614; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
.box { background: #130b20; padding: 30px; border-radius: 15px; border: 1px solid #3e1e56; width: 350px; text-align: center; }
input { width: 100%; padding: 12px; margin: 10px 0; background: #09050f; border: 1px solid #492460; color: white; border-radius: 8px; }
button { width: 100%; padding: 12px; background: #ff9900; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; color: white; }
a { color: #42d66d; text-decoration: none; display: block; margin-top: 15px; }
</style>
</head>
<body>
<div class="box">
    <h2>📝 Create Account</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Choose Username" required>
        <input type="password" name="password" placeholder="Choose Password" required>
        <button type="submit">Register</button>
    </form>
    <a href="/login">Already have an account? Login</a>
</div>
</body>
</html>
