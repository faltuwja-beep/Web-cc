{% extends "base.html" %}

{% block title %}
Admin Products
{% endblock %}

{% block content %}

<div class="page-header">

    <h1>
        🛍️ Manage Products
    </h1>

</div>


<div class="admin-nav">

    <a href="{{ url_for('admin_dashboard') }}">
        Dashboard
    </a>

    <a href="{{ url_for('admin_payments') }}">
        Payments
    </a>

    <a href="{{ url_for('admin_users') }}">
        Users
    </a>

</div>


<div class="admin-form">

    <h2>
        ➕ Create Product
    </h2>

    <form method="POST">

        <input
            name="name"
            placeholder="Product Name"
            required
        >

        <textarea
            name="description"
            placeholder="Product Description"
        ></textarea>

        <input
            type="number"
            name="price"
            step="0.01"
            placeholder="Price"
            required
        >

        <input
            name="image"
            placeholder="Image URL (Optional)"
        >

        <input
            name="category"
            placeholder="Category"
            value="Redeem Code"
        >

        <button
            class="primary-button"
            type="submit"
        >
            Create Product
        </button>

    </form>

</div>


<div class="admin-product-list">

{% for product in products %}

    <div class="admin-product">

        <div>

            <h3>

                {{ product.name }}

            </h3>

            <p>

                ₹{{ product.price }}

            </p>

        </div>


        <form
            method="POST"
            action="{{ url_for('admin_add_code', product_id=product.id) }}"
        >

            <input
                name="code"
                placeholder="Add Redeem Code"
                required
            >

            <button
                type="submit"
                class="small-button"
            >
                Add Code
            </button>

        </form>


        <a
            href="{{ url_for('admin_delete_product', product_id=product.id) }}"
            class="delete-button"
            onclick="return confirm('Delete product?')"
        >

            Delete

        </a>

    </div>

{% else %}

    <div class="empty-card">

        No products yet.

    </div>

{% endfor %}

</div>

{% endblock %}
