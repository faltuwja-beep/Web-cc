<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Payment - DigiStore</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 {
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .amount-box {
            font-size: 24px;
            font-weight: bold;
            color: #10b981;
            margin-bottom: 20px;
            background: rgba(16, 185, 129, 0.1);
            padding: 10px;
            border-radius: 6px;
        }
        .upi-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 15px;
            border: 1px dashed #475569;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
        }
        .btn {
            width: 100%;
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0284c7;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Complete Payment</h2>
        
        <div class="amount-box">
            Amount: ₹{{ amount }}
        </div>

        <div class="upi-box">
            Pay to UPI ID:<br>
            <strong style="color: #38bdf8; font-size: 18px;">{{ upi_id }}</strong>
        </div>

        <form method="POST">
            <div class="form-group">
                <label for="utr">Enter UTR / Transaction ID:</label>
                <input type="text" id="utr" name="utr" placeholder="e.g. 4356XXXXXXXX" required>
            </div>

            <button type="submit" class="btn">Submit Payment</button>
        </form>

        <a href="{{ url_for('wallet') }}" class="back-link">← Back to Wallet</a>
    </div>

</body>
</html>
