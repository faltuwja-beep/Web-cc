{% extends "base.html" %}

{% block title %}Login | Sima Store{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            🎮
        </div>

        <h1>Welcome Back</h1>

        <p>
            Login to access your wallet and store
        </p>


        <form method="POST">

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    class="input"
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    class="input"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-btn"
            >
                🔐 Login Now
            </button>

        </form>


        <div class="auth-link">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>

    </div>

</div>

{% endblock %}
