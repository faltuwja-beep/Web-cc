{% extends "base.html" %}

{% block title %}
Login - Prime Shop
{% endblock %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-icon">
            🔐
        </div>

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to your account
        </p>

        <form method="POST">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button
                type="submit"
                class="primary-button full"
            >
                Login
            </button>

        </form>

        <p class="auth-bottom">

            Don't have an account?

            <a
                href="{{ url_for('register') }}"
            >
                Register
            </a>

        </p>

    </div>

</div>

{% endblock %}
