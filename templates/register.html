{% extends "base.html" %}

{% block title %}
Register | Sima Store
{% endblock %}


{% block content %}

<div class="auth-container">

<div class="auth-card">

<div class="auth-logo">
🚀
</div>

<h1>
Create Account
</h1>

<p>
Join Sima Premium Store
</p>


<form method="POST">


<div class="form-group">

<label>
Username
</label>

<input
class="input"
type="text"
name="username"
placeholder="Choose username"
required
>

</div>


<div class="form-group">

<label>
Password
</label>

<input
class="input"
type="password"
name="password"
placeholder="Create password"
required
>

</div>


<button
class="primary-btn"
type="submit"
>

✨ Create Account

</button>


</form>


<div class="auth-link">

Already have account?

<a href="/login">

Login

</a>

</div>

</div>

</div>

{% endblock %}
