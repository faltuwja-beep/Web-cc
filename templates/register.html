{% extends "base.html" %}

{% block title %}
Register - Prime Shop
{% endblock %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-icon">
            🚀
        </div>

        <h1>
            Create Account
        </h1>

        <p>
            Join Prime Shop today
        </p>

        <form method="POST">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Minimum 3 characters"
                required
            >

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 6 characters"
                required
            >

            <button
                type="submit"
                class="primary-button full"
            >
                Create Account
            </button>

        </form>

        <p class="auth-bottom">

            Already have account?

            <a
                href="{{ url_for('login') }}"
            >
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
