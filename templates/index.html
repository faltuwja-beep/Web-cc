<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Login - YoYo Shop</title>
<style>
body { background: #0b0614; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
.box { background: #130b20; padding: 30px; border-radius: 15px; border: 1px solid #3e1e56; width: 350px; text-align: center; }
input { width: 100%; padding: 12px; margin: 10px 0; background: #09050f; border: 1px solid #492460; color: white; border-radius: 8px; }
button { width: 100%; padding: 12px; background: #38d46b; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; color: #07100a; }
a { color: #42d66d; text-decoration: none; display: block; margin-top: 15px; }
</style>
</head>
<body>
<div class="box">
    <h2>🔐 Login to YoYo Shop</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for cat, msg in messages %}<p style="color: {% if cat=='error' %}#ff9ba5{% else %}#38d46b{% endif %}; font-size: 13px;">{{ msg }}</p>{% endfor %}{% endif %}
    {% endwith %}
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <a href="/register">Don't have an account? Register</a>
</div>
</body>
</html>
