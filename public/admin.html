<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xenon Shop Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#070914;
  color:#fff;
  padding:25px;
}

.box{
  max-width:500px;
  margin:40px auto;
  background:#111528;
  border:1px solid #2b3150;
  border-radius:24px;
  padding:28px;
}

.logo{
  font-size:30px;
  font-weight:900;
}

.logo span{
  color:#8255ff;
}

h1{
  margin-top:30px;
}

.sub{
  color:#9298b3;
  margin-bottom:25px;
}

label{
  display:block;
  margin:16px 0 8px;
  color:#bfc4d8;
}

input{
  width:100%;
  padding:15px;
  border-radius:13px;
  border:1px solid #303752;
  background:#080b18;
  color:white;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  padding:16px;
  margin-top:22px;
  border:0;
  border-radius:14px;
  background:#7952ff;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.message{
  margin-top:18px;
  padding:13px;
  border-radius:12px;
  background:#321b29;
  color:#ff9ab8;
  display:none;
}

#dashboard{
  display:none;
}

.card{
  background:#080b18;
  border:1px solid #292f4c;
  border-radius:16px;
  padding:20px;
  margin-top:14px;
}

.number{
  font-size:30px;
  font-weight:bold;
  margin-top:7px;
}

.logout{
  background:#292e43;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    XENON<span>SHOP</span>
  </div>

  <!-- LOGIN -->

  <div id="login">

    <h1>Admin Login</h1>

    <div class="sub">
      Login to Xenon Shop Admin Panel
    </div>

    <label>Email</label>

    <input
      id="email"
      type="email"
      value="admin@xenon.shop"
      placeholder="Admin email"
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Admin password"
    >

    <button onclick="loginAdmin()">
      🔐 Login
    </button>

    <div
      id="message"
      class="message"
    ></div>

  </div>


  <!-- DASHBOARD -->

  <div id="dashboard">

    <h1>Admin Panel</h1>

    <div class="sub">
      Xenon Shop Control Center
    </div>

    <div class="card">
      👥 Users
      <div
        id="users"
        class="number"
      >
        Loading...
      </div>
    </div>

    <div class="card">
      📦 Products
      <div
        id="products"
        class="number"
      >
        Loading...
      </div>
    </div>

    <div class="card">
      💰 Deposits
      <div
        id="deposits"
        class="number"
      >
        Loading...
      </div>
    </div>

    <div class="card">
      🛒 Purchases
      <div
        id="orders"
        class="number"
      >
        Loading...
      </div>
    </div>

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</div>


<script>

let adminEmail = "";
let adminPassword = "";


/* MESSAGE */

function message(text){

  const box =
    document.getElementById("message");

  box.innerText = text;
  box.style.display = "block";

}


/* ADMIN LOGIN */

async function loginAdmin(){

  const email =
    document.getElementById("email")
      .value
      .trim();

  const password =
    document.getElementById("password")
      .value;


  if(!email || !password){

    message(
      "Email aur password bharo."
    );

    return;
  }


  const button =
    document.querySelector(
      "#login button"
    );

  button.disabled = true;

  button.innerText =
    "Checking...";


  try{

    /*
      Tumhare server me
      admin login endpoint nahi hai.

      Server headers check karta hai.
    */

    const response =
      await fetch(
        "/api/admin/deposits",
        {
          method:"GET",

          headers:{
            "x-admin-email":email,
            "x-admin-password":password
          }
        }
      );


    if(response.status === 401){

      throw new Error(
        "Invalid admin email ya password."
      );

    }


    if(!response.ok){

      throw new Error(
        "Admin server error."
      );

    }


    /*
      Login successful
    */

    adminEmail = email;
    adminPassword = password;


    sessionStorage.setItem(
      "xenon_admin_email",
      email
    );

    sessionStorage.setItem(
      "xenon_admin_password",
      password
    );


    document.getElementById(
      "login"
    ).style.display = "none";


    document.getElementById(
      "dashboard"
    ).style.display = "block";


    loadDashboard();

  }

  catch(error){

    message(
      error.message
    );

  }

  finally{

    button.disabled = false;

    button.innerText =
      "🔐 Login";

  }

}


/* AUTH HEADERS */

function headers(){

  return {

    "x-admin-email":
      adminEmail,

    "x-admin-password":
      adminPassword

  };

}


/* DASHBOARD */

async function loadDashboard(){

  try{

    /*
      Products
    */

    const productsResponse =
      await fetch(
        "/api/products"
      );

    const products =
      await productsResponse.json();


    document.getElementById(
      "products"
    ).innerText =
      Array.isArray(products)
        ? products.length
        : 0;


    /*
      Deposits
    */

    const depositsResponse =
      await fetch(
        "/api/admin/deposits",
        {
          headers:headers()
        }
      );


    const deposits =
      await depositsResponse.json();


    document.getElementById(
      "deposits"
    ).innerText =
      Array.isArray(deposits)
        ? deposits.length
        : 0;


    /*
      Users/orders ka separate
      admin endpoint tumhare
      current server me nahi hai.
    */

    document.getElementById(
      "users"
    ).innerText =
      "—";


    document.getElementById(
      "orders"
    ).innerText =
      "—";

  }

  catch(error){

    console.log(error);

  }

}


/* LOGOUT */

function logout(){

  sessionStorage.removeItem(
    "xenon_admin_email"
  );

  sessionStorage.removeItem(
    "xenon_admin_password"
  );

  adminEmail = "";
  adminPassword = "";

  location.reload();

}


/* AUTO LOGIN */

window.addEventListener(
  "load",
  () => {

    const email =
      sessionStorage.getItem(
        "xenon_admin_email"
      );

    const password =
      sessionStorage.getItem(
        "xenon_admin_password"
      );


    if(email && password){

      adminEmail = email;
      adminPassword = password;

      document.getElementById(
        "login"
      ).style.display = "none";

      document.getElementById(
        "dashboard"
      ).style.display = "block";

      loadDashboard();

    }

  }
);

</script>

</body>
</html>
