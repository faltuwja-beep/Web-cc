<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Xenon Shop Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#09080f;
  color:#fff;
  padding-bottom:40px;
}

header{
  padding:18px 20px;
  background:#12101c;
  border-bottom:1px solid #292535;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:25px;
  font-weight:900;
}

.logo span{
  color:#9b5cff;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 16px;
}

.card{
  background:#13111c;
  border:1px solid #2b2737;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 10px 30px #0005;
}

h1,h2,h3{
  margin-top:0;
}

input,
textarea{
  width:100%;
  padding:14px;
  margin:7px 0 12px;
  border-radius:12px;
  border:1px solid #393444;
  background:#1c1925;
  color:#fff;
  font-size:15px;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:#9b5cff;
}

textarea{
  min-height:110px;
  resize:vertical;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-weight:800;
  cursor:pointer;
  background:#8b4dff;
  color:#fff;
  margin:4px;
}

button:hover{
  opacity:.9;
}

.danger{
  background:#e54268;
}

.success{
  background:#18a66b;
}

.secondary{
  background:#302b3c;
}

.hidden{
  display:none!important;
}

.msg{
  padding:12px;
  border-radius:10px;
  margin:10px 0;
  background:#211d2b;
  color:#ffb4c5;
}

.ok{
  color:#65e6a0;
  padding:10px 0;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.stats{
  font-size:26px;
  font-weight:900;
}

.small{
  color:#aaa5b6;
  font-size:13px;
}

.product{
  overflow:hidden;
}

.product img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:12px;
  background:#222;
}

.price{
  font-size:21px;
  font-weight:900;
  color:#b47aff;
  margin:10px 0;
}

.deposit{
  border:1px solid #332e40;
  border-radius:14px;
  padding:15px;
  margin:10px 0;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#332b42;
  font-size:12px;
}

.delivery{
  background:#0e0c15;
  border:1px solid #302b3c;
  border-radius:12px;
  padding:12px;
  margin-top:12px;
  white-space:pre-wrap;
  word-break:break-word;
}

hr{
  border:0;
  border-top:1px solid #292535;
  margin:20px 0;
}

.loading{
  padding:20px;
  color:#aaa5b6;
}

</style>

</head>


<body>


<header>

  <div class="logo">
    XENON<span>SHOP</span>
  </div>

  <button
    id="logout"
    class="secondary hidden"
  >
    Logout
  </button>

</header>


<div class="container">


<!-- =========================
     LOGIN
========================= -->

<section
  id="loginBox"
  class="card"
>

  <h1>Admin Login 🔐</h1>

  <p class="small">
    Xenon Shop administration panel
  </p>

  <label>Admin Email</label>

  <input
    id="email"
    type="email"
    placeholder="Admin Email"
    autocomplete="username"
  >

  <label>Admin Password</label
