<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xenon Shop Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#070914;
  color:#fff;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

.box{
  background:#111528;
  border:1px solid #292f4d;
  border-radius:22px;
  padding:25px;
  margin-top:30px;
}

.logo{
  font-size:28px;
  font-weight:900;
}

.logo span{
  color:#8055ff;
}

input,textarea{
  width:100%;
  padding:14px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid #303752;
  background:#080b18;
  color:white;
  font-size:16px;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

label{
  display:block;
  margin-top:18px;
  color:#bfc4d8;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 18px;
  background:#7952ff;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  margin-top:18px;
}

button.secondary{
  background:#292e43;
}

button.danger{
  background:#b52b4b;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#321b29;
  color:#ff9ab8;
}

#panel{
  display:none;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  margin-top:20px;
}

.stat{
  background:#080b18;
  border:1px solid #292f4d;
  border-radius:15px;
  padding:18px;
}

.stat b{
  display:block;
  font-size:27px;
  margin-top:7px;
}

.product{
  background:#080b18;
  border:1px solid #292f4d;
  border-radius:15px;
  padding:18px;
  margin-top:12px;
}

.product img{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:12px;
}

.deposit{
  background:#080b18;
  border:1px solid #292f4d;
  border-radius:15px;
  padding:18px;
  margin-top:12px;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.row button{
  flex:1;
}

.small{
  color:#9298b3;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<div class="box">

<div class="logo">
XENON<span>SHOP</span>
</div>

<!-- LOGIN -->

<div id="loginBox">

<h2>Admin Login</h2>

<p class="small">
Xenon Shop Administrator
</p>

<label>Email</label>

<input
id="email"
type="email"
value="admin@xenon.shop"
>

<label>Password</label>

<input
id="password"
type="password"
placeholder="Admin password"
>

<button
onclick="login()"
>
🔐 Login
</button>

<div
id="message"
class="message"
></div>

</div>


<!-- PANEL -->

<div id="panel">

<h2>Admin Panel</h2>

<div class="stats">

<div class="stat">
Users
<b id="users">0</b>
</div>

<div class="stat">
Products
<b id="products">0</b>
</div>

<div class="stat">
Pending Deposits
<b id="pending">0</b>
</div>

<div class="stat">
Purchases
<b id="purchases">0</b>
</div>

</div>


<!-- PRODUCT -->

<div class="box">

<h2>Add Product</h2>

<label>Product Name</label>

<input
id="productName"
placeholder="Example: Premium Account"
>

<label>Price</label>

<input
id="productPrice"
type="number"
placeholder="99"
>

<label>Description</label>

<textarea
id="productDescription"
placeholder="Product ke bare me likho..."
></textarea>

<label>Image URL</label>

<input
id="productImage"
placeholder="https://..."
>

<label>Icon</label>

<input
id="productIcon"
value="📦"
>

<button
onclick="addProduct()"
>
➕ Add Product
</button>

<div
id="productMessage"
class="message"
></div>

</div>


<!-- PRODUCTS -->

<div class="box">

<h2>Products</h2>

<div id="productList">
Loading...
</div>

</div>


<!-- DEPOSITS -->

<div class="box">

<h2>Pending Deposits</h2>

<div id="depositList">
Loading...
</div>

</div>


<button
class="secondary"
onclick="logout()"
>
Logout
</button>

</div>

</div>

</div>


<script>

let token =
localStorage.getItem("xenon_admin_token");


function showMessage(id,text){

const box =
document.getElementById(id);

box.innerText=text;
box.style.display="block";

}


async function login(){

const email =
document.getElementById("email")
.value
.trim();

const password =
document.getElementById("password")
.value;


if(!email || !password){

showMessage(
"message",
"Email aur password bharo."
);

return;

}


try{

const response =
await fetch(
"/api/admin/login",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
email:email,
password:password
})
}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error ||
"Invalid admin login"
);

}


token=data.token;

localStorage.setItem(
"xenon_admin_token",
token
);


document.getElementById(
"loginBox"
).style.display="none";


document.getElementById(
"panel"
).style.display="block";


loadAll();

}

catch(error){

showMessage(
"message",
error.message
);

}

}


/* AUTH */

function authHeaders(){

return {
"Authorization":
"Bearer "+token,
"Content-Type":
"application/json"
};

}


/* LOAD EVERYTHING */

async function loadAll(){

await loadStats();

await loadProducts();

await loadDeposits();

}


/* STATS */

async function loadStats(){

try{

const response =
await fetch(
"/api/admin/stats",
{
headers:authHeaders()
}
);


if(response.status===401 ||
response.status===403){

logout();
return;

}


const data =
await response.json();


document.getElementById(
"users"
).innerText =
data.users || 0;


document.getElementById(
"products"
).innerText =
data.products || 0;


document.getElementById(
"pending"
).innerText =
data.pendingDeposits || 0;


document.getElementById(
"purchases"
).innerText =
data.purchases || 0;

}

catch(error){

console.log(error);

}

}


/* PRODUCTS */

async function loadProducts(){

try{

const response =
await fetch(
"/api/products"
);

const products =
await response.json();


const box =
document.getElementById(
"productList"
);


if(!Array.isArray(products) ||
products.length===0){

box.innerHTML=
"<p class='small'>No products yet.</p>";

return;

}


box.innerHTML =
products.map(p => `

<div class="product">

${
p.image
?
`<img src="${safe(p.image)}">`
:
`<div style="font-size:40px">
${safe(p.icon || "📦")}
</div>`
}

<h3>
${safe(p.name)}
</h3>

<p class="small">
${safe(p.description)}
</p>

<b>
₹${Number(p.price)}
</b>

<br>

<button
class="danger"
onclick="deleteProduct('${p.id}')"
>
Delete
</button>

</div>

`).join("");

}

catch(error){

console.log(error);

}

}


/* ADD PRODUCT */

async function addProduct(){

const name =
document.getElementById(
"productName"
).value.trim();

const price =
Number(
document.getElementById(
"productPrice"
).value
);

const description =
document.getElementById(
"productDescription"
).value.trim();

const image =
document.getElementById(
"productImage"
).value.trim();

const icon =
document.getElementById(
"productIcon"
).value.trim();


if(!name){

showMessage(
"productMessage",
"Product name required."
);

return;

}


if(!price || price<=0){

showMessage(
"productMessage",
"Valid price required."
);

return;

}


try{

const response =
await fetch(
"/api/admin/products",
{
method:"POST",
headers:authHeaders(),

body:JSON.stringify({
name,
price,
description,
image,
icon
})
}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error ||
"Product add failed"
);

}


document.getElementById(
"productName"
).value="";

document.getElementById(
"productPrice"
).value="";

document.getElementById(
"productDescription"
).value="";

document.getElementById(
"productImage"
).value="";


loadAll();

}

catch(error){

showMessage(
"productMessage",
error.message
);

}

}


/* DELETE PRODUCT */

async function deleteProduct(id){

if(!confirm(
"Product delete karna hai?"
)) return;


try{

const response =
await fetch(
"/api/admin/products/"+id,
{
method:"DELETE",
headers:authHeaders()
}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error ||
"Delete failed"
);

}


loadAll();

}

catch(error){

alert(error.message);

}

}


/* DEPOSITS */

async function loadDeposits(){

try{

const response =
await fetch(
"/api/admin/deposits",
{
headers:authHeaders()
}
);


const deposits =
await response.json();


const box =
document.getElementById(
"depositList"
);


if(!Array.isArray(deposits) ||
deposits.length===0){

box.innerHTML=
"<p class='small'>No deposits.</p>";

return;

}


box.innerHTML =
deposits.map(d => `

<div class="deposit">

<b>
${safe(d.userName)}
</b>

<p class="small">
${safe(d.userEmail)}
</p>

<p>
Amount:
<b>₹${Number(d.amount)}</b>
</p>

<p>
UTR:
<b>${safe(d.utr)}</b>
</p>

<p class="small">
Status: ${safe(d.status)}
</p>

${
d.status==="PENDING"
?
`
<div class="row">

<button
onclick="processDeposit('${d.id}','APPROVED')"
>
✅ Approve
</button>

<button
class="danger"
onclick="processDeposit('${d.id}','REJECTED')"
>
❌ Reject
</button>

</div>
`
:
""
}

</div>

`).join("");

}

catch(error){

console.log(error);

}

}


/* APPROVE / REJECT */

async function processDeposit(
id,
status
){

try{

const response =
await fetch(
"/api/admin/deposits/"+id,
{
method:"POST",
headers:authHeaders(),

body:JSON.stringify({
status:status
})
}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error ||
"Deposit update failed"
);

}


loadAll();

}

catch(error){

alert(error.message);

}

}


/* ESCAPE */

function safe(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* LOGOUT */

function logout(){

localStorage.removeItem(
"xenon_admin_token"
);

token=null;

location.reload();

}


/* AUTO LOGIN */

window.addEventListener(
"load",
async function(){

if(!token) return;


try{

const response =
await fetch(
"/api/admin/stats",
{
headers:authHeaders()
}
);


if(response.ok){

document.getElementById(
"loginBox"
).style.display="none";

document.getElementById(
"panel"
).style.display="block";

loadAll();

}

else{

logout();

}

}
catch(error){

logout();

}

});

</script>

</body>
  </html>
