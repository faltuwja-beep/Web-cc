<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xenon Shop - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #070914;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: #111528;
      border: 1px solid #292f4d;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .logo span {
      color: #8657ff;
    }

    h1 {
      margin: 30px 0 8px;
      font-size: 32px;
    }

    .sub {
      color: #9298b3;
      margin-bottom: 28px;
    }

    label {
      display: block;
      color: #b8bdd2;
      margin: 18px 0 8px;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #303654;
      background: #080b18;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #8657ff;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #7952ff;
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 12px;
      display: none;
      background: #26172a;
      color: #ff9cbd;
    }

    .dashboard {
      display: none;
    }

    .stat {
      background: #080b18;
      border: 1px solid #292f4d;
      padding: 18px;
      border-radius: 16px;
      margin-top: 12px;
    }

    .stat b {
      font-size: 25px;
      display: block;
      margin-top: 5px;
    }

    .logout {
      background: #242941;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      XENON<span>SHOP</span>
    </div>

    <!-- LOGIN -->

    <div id="loginBox">

      <h1>Admin Login</h1>

      <div class="sub">
        Xenon Shop administrator panel
      </div>

      <label>Email</label>

      <input
        id="email"
        type="email"
        placeholder="Admin email"
        autocomplete="username"
      >

      <label>Password</label>

      <input
        id="password"
        type="password"
        placeholder="Admin password"
        autocomplete="current-password"
      >

      <button onclick="adminLogin()">
        🔐 Login to Admin
      </button>

      <div id="message" class="message"></div>

    </div>


    <!-- DASHBOARD -->

    <div id="dashboard">

      <h1>Admin Panel</h1>

      <div class="sub">
        Welcome to Xenon Shop
      </div>

      <div class="stat">
        Users
        <b id="users">0</b>
      </div>

      <div class="stat">
        Products
        <b id="products">0</b>
      </div>

      <div class="stat">
        Pending Deposits
        <b id="pending">0</b>
      </div>

      <div class="stat">
        Purchases
        <b id="purchases">0</b>
      </div>

      <button class="logout" onclick="logout()">
        Logout
      </button>

    </div>

  </div>


<script>

  const ADMIN_EMAIL = "admin@xenon.shop";
  const ADMIN_PASSWORD = "admin123";


  function showMessage(text) {

    const box =
      document.getElementById("message");

    box.innerText = text;
    box.style.display = "block";

  }


  async function adminLogin() {

    const email =
      document.getElementById("email")
        .value
        .trim();

    const password =
      document.getElementById("password")
        .value;


    if (!email || !password) {

      showMessage(
        "Email aur password dono bharo."
      );

      return;
    }


    const button =
      document.querySelector("#loginBox button");

    button.disabled = true;
    button.innerText = "Logging in...";


    try {

      const response =
        await fetch("/api/admin/login", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            email: email,
            password: password
          })

        });


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Admin login failed"
        );

      }


      localStorage.setItem(
        "xenon_admin_token",
        data.token
      );


      document.getElementById(
        "loginBox"
      ).style.display = "none";


      document.getElementById(
        "dashboard"
      ).style.display = "block";


      loadStats();

    }

    catch (error) {

      showMessage(
        error.message
      );

    }

    finally {

      button.disabled = false;
      button.innerText =
        "🔐 Login to Admin";

    }

  }


  async function loadStats() {

    const token =
      localStorage.getItem(
        "xenon_admin_token"
      );


    if (!token) return;


    try {

      const response =
        await fetch(
          "/api/admin/stats",
          {
            headers: {
              Authorization:
                "Bearer " + token
            }
          }
        );


      const data =
        await response.json();


      if (!response.ok) {
        throw new Error(
          data.error || "Stats error"
        );
      }


      document.getElementById(
        "users"
      ).innerText =
        data.users || 0;


      document.getElementById(
        "products"
      ).innerText =
        data.products || 0;


      document.getElementById(
        "pending"
      ).innerText =
        data.pendingDeposits || 0;


      document.getElementById(
        "purchases"
      ).innerText =
        data.purchases || 0;

    }

    catch (error) {

      console.log(error);

      logout();

    }

  }


  function logout() {

    localStorage.removeItem(
      "xenon_admin_token"
    );

    location.reload();

  }


  /*
    Agar pehle se admin token hai
    to dashboard dikhao.
  */

  window.addEventListener(
    "load",
    () => {

      const token =
        localStorage.getItem(
          "xenon_admin_token"
        );

      if (token) {

        document.getElementById(
          "loginBox"
        ).style.display = "none";

        document.getElementById(
          "dashboard"
        ).style.display = "block";

        loadStats();

      }

    }
  );

</script>

</body>
</html>
