<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xenon Shop</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top">
  <div class="logo">XENON<span>SHOP</span></div>
  <div>Balance: ₹<b id="balance">0</b></div>
</header>

<main class="wrap">

<section class="hero">
  <h1>Welcome, <span id="username"></span> 👋</h1>
  <p>Choose your product.</p>
</section>

<h2>Products</h2>
<div id="products" class="grid"></div>

</main>

<nav class="nav">
  <a href="/shop.html">🏠 Shop</a>
  <a href="/wallet.html">💰 Wallet</a>
  <a href="/referral.html">🎁 Refer</a>
  <a href="/profile.html">👤 Profile</a>
</nav>

<script>

const token = localStorage.getItem("xenon_token");

if(!token){
  location.href="/login.html";
}

const headers = {
  "Authorization":"Bearer "+token,
  "Content-Type":"application/json"
};

async function load(){

  const userResponse =
    await fetch("/api/me",{headers});

  if(!userResponse.ok){
    localStorage.removeItem("xenon_token");
    location.href="/login.html";
    return;
  }

  const user =
    await userResponse.json();

  document.getElementById("username").textContent =
    user.name;

  document.getElementById("balance").textContent =
    user.balance;

  const response =
    await fetch("/api/products");

  const products =
    await response.json();

  document.getElementById("products").innerHTML =
    products.map(product => `

      <div class="card">

        <div style="font-size:42px">
          ${product.icon}
        </div>

        <h3>${product.name}</h3>

        <p>${product.description}</p>

        <div class="price">
          ₹${product.price}
        </div>

        <button
          class="btn"
          onclick="buy(${product.id})">

          BUY NOW

        </button>

      </div>

    `).join("");

}

async function buy(id){

  const response =
    await fetch("/api/buy",{
      method:"POST",
      headers,
      body:JSON.stringify({
        productId:id
      })
    });

  const data =
    await response.json();

  if(!response.ok){
    alert(data.error);
    return;
  }

  alert("Purchase successful!");

  load();
}

load();

</script>

</body>
</html>
