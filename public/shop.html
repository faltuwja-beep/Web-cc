<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Xenon Shop</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <!-- TOP BAR -->

  <header class="topbar">

    <div class="logo">
      XENON<span>SHOP</span>
    </div>

    <div class="balance">
      ₹<span id="balance">0</span>
    </div>

  </header>


  <!-- MAIN -->

  <main class="container">

    <!-- HERO -->

    <section class="hero">

      <div class="small-text">
        MEMBER AREA
      </div>

      <h1>
        Welcome,
        <span id="username">
          User
        </span>
        👋
      </h1>

      <p>
        Choose your premium product
        and buy instantly using your wallet.
      </p>

      <div
        class="row wrap"
        style="margin-top:22px"
      >

        <a
          href="/wallet.html"
          class="btn"
        >
          + Add Money
        </a>

        <a
          href="/referral.html"
          class="btn-secondary"
        >
          🎁 Refer & Earn
        </a>

      </div>

    </section>


    <!-- PRODUCTS -->

    <h2 class="section-title">
      Premium Products
    </h2>

    <div
      id="products"
      class="grid"
    >

      <div class="card">
        Loading products...
      </div>

    </div>


    <!-- ACTIVITY -->

    <h2 class="section-title">
      Recent Purchases
    </h2>

    <div
      id="activity"
      class="card"
    >

      <p class="small-text">
        Loading activity...
      </p>

    </div>

  </main>


  <!-- BOTTOM NAV -->

  <nav class="bottom-nav">

    <a
      href="/shop.html"
      class="active"
    >
      🏠 Shop
    </a>

    <a
      href="/wallet.html"
    >
      💰 Wallet
    </a>

    <a
      href="/referral.html"
    >
      🎁 Refer
    </a>

    <a
      href="/profile.html"
    >
      👤 Profile
    </a>

  </nav>


  <!-- SCRIPT -->

  <script>

    const token =
      localStorage.getItem(
        "xenon_admin"
      );

    const userToken =
      localStorage.getItem(
        "xenon_token"
      );


    /* LOGIN CHECK */

    if (!userToken) {

      location.href =
        "/login.html";

    }


    const headers = {

      "Authorization":
        "Bearer " +
        userToken,

      "Content-Type":
        "application/json"

    };


    /* ---------------- LOAD USER ---------------- */

    async function loadUser() {

      try {

        const response =
          await fetch(
            "/api/me",
            {
              headers
            }
          );


        if (!response.ok) {

          localStorage.removeItem(
            "xenon_token"
          );

          location.href =
            "/login.html";

          return;

        }


        const user =
          await response.json();


        document
          .getElementById(
            "username"
          )
          .textContent =
          user.name;


        document
          .getElementById(
            "balance"
          )
          .textContent =
          Number(
            user.balance || 0
          ).toFixed(0);

      }

      catch (error) {

        console.error(error);

      }

    }


    /* ---------------- LOAD PRODUCTS ---------------- */

    async function loadProducts() {

      try {

        const response =
          await fetch(
            "/api/products"
          );


        const products =
          await response.json();


        const box =
          document
            .getElementById(
              "products"
            );


        if (
          !Array.isArray(
            products
          ) ||
          products.length === 0
        ) {

          box.innerHTML = `

            <div class="card">

              <h3>
                No products available
              </h3>

              <p class="small-text">
                Admin ne abhi koi product add nahi kiya.
              </p>

            </div>

          `;

          return;

        }


        box.innerHTML =
          products
            .map(
              product => {

                const image =
                  product.image ||
                  "";


                return `

                  <div
                    class="card product"
                  >

                    ${
                      image
                        ? `

                          <img
                            src="${escapeHtml(image)}"
                            class="product-image"
                            alt="${escapeHtml(product.name)}"
                            onerror="imageError(this)"
                          >

                        `
                        : `

                          <div
                            class="product-icon"
                          >
                            ${escapeHtml(
                              product.icon ||
                              "📦"
                            )}
                          </div>

                        `
                    }


                    <h3>
                      ${escapeHtml(
                        product.name
                      )}
                    </h3>


                    <p
                      class="description"
                    >
                      ${escapeHtml(
                        product.description ||
                        "Premium digital product."
                      )}
                    </p>


                    <div class="price">
                      ₹${Number(
                        product.price
                      )}
                    </div>


                    <button
                      class="btn full"
                      onclick="buyProduct(${product.id})"
                    >
                      BUY NOW
                    </button>

                  </div>

                `;

              }
            )
            .join("");

      }

      catch (error) {

        console.error(error);

        document
          .getElementById(
            "products"
          )
          .innerHTML = `

            <div class="card">

              <h3>
                Products load nahi hue
              </h3>

              <p class="small-text">
                Page refresh karke dobara try karo.
              </p>

            </div>

          `;

      }

    }


    /* ---------------- BUY ---------------- */

    async function buyProduct(
      productId
    ) {

      const confirmBuy =
        confirm(
          "Kya aap ye product buy karna chahte ho?"
        );


      if (!confirmBuy) {

        return;

      }


      try {

        const response =
          await fetch(
            "/api/buy",
            {
              method: "POST",

              headers,

              body:
                JSON.stringify({
                  productId
                })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          alert(
            data.error ||
            "Purchase failed"
          );

          return;

        }


        alert(
          "✅ Purchase successful!"
        );


        await loadUser();

        await loadActivity();

      }

      catch (error) {

        alert(
          "Server connection error"
        );

      }

    }


    /* ---------------- ACTIVITY ---------------- */

    async function loadActivity() {

      try {

        const response =
          await fetch(
            "/api/activity"
          );


        const activity =
          await response.json();


        const box =
          document
            .getElementById(
              "activity"
            );


        if (
          !Array.isArray(
            activity
          ) ||
          activity.length === 0
        ) {

          box.innerHTML = `

            <p class="small-text">
              Abhi koi purchase nahi hua.
            </p>

          `;

          return;

        }


        box.innerHTML =
          activity
            .map(
              item => {

                const date =
                  new Date(
                    item.createdAt
                  );


                const time =
                  date.toLocaleString();


                return `

                  <div
                    class="activity"
                  >

                    <span
                      class="activity-dot"
                    ></span>

                    <div>

                      <b>
                        ${escapeHtml(
                          item.name
                        )}
                      </b>

                      purchased

                      <b>
                        ${escapeHtml(
                          item.product
                        )}
                      </b>
