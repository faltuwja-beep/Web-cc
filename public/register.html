<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Register • Xenon Shop</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <main class="auth-page">

    <div class="form-card">

      <div class="logo">
        XENON<span>SHOP</span>
      </div>

      <h1>Create Account 🚀</h1>

      <p class="small-text">
        Create your Xenon account and start shopping.
      </p>


      <label for="name">
        Name
      </label>

      <input
        id="name"
        class="input"
        type="text"
        autocomplete="name"
        placeholder="Your name"
      >


      <label for="email">
        Email
      </label>

      <input
        id="email"
        class="input"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
      >


      <label for="password">
        Password
      </label>

      <input
        id="password"
        class="input"
        type="password"
        autocomplete="new-password"
        placeholder="Minimum 6 characters"
      >


      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        id="confirmPassword"
        class="input"
        type="password"
        autocomplete="new-password"
        placeholder="Enter password again"
      >


      <label for="referral">
        Referral Code
        <span class="small-text">
          (optional)
        </span>
      </label>

      <input
        id="referral"
        class="input"
        type="text"
        placeholder="Referral code"
      >


      <br>

      <button
        id="registerBtn"
        class="btn full"
        onclick="registerUser()"
      >
        CREATE ACCOUNT
      </button>


      <p
        id="message"
        class="small-text"
        style="
          display:none;
          margin-top:15px;
        "
      ></p>


      <div
        style="
          text-align:center;
          margin-top:22px;
        "
      >

        <span class="small-text">
          Already have an account?
        </span>

        <a
          href="/login.html"
          style="
            color:#a78bfa;
            font-weight:800;
          "
        >
          Login
        </a>

      </div>


      <div
        style="
          text-align:center;
          margin-top:14px;
        "
      >

        <a
          href="/"
          class="small-text"
        >
          ← Back to Home
        </a>

      </div>

    </div>

  </main>


  <script>

    async function registerUser() {

      const name =
        document
          .getElementById(
            "name"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "email"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "password"
          )
          .value;


      const confirmPassword =
        document
          .getElementById(
            "confirmPassword"
          )
          .value;


      const referral =
        document
          .getElementById(
            "referral"
          )
          .value
          .trim();


      const button =
        document
          .getElementById(
            "registerBtn"
          );


      if (!name) {

        showMessage(
          "Name enter karo.",
          true
        );

        return;

      }


      if (!email) {

        showMessage(
          "Email enter karo.",
          true
        );

        return;

      }


      if (password.length < 6) {

        showMessage(
          "Password kam se kam 6 characters ka hona chahiye.",
          true
        );

        return;

      }


      if (
        password !==
        confirmPassword
      ) {

        showMessage(
          "Passwords match nahi kar rahe.",
          true
        );

        return;

      }


      button.disabled = true;

      button.textContent =
        "CREATING...";


      try {

        const response =
          await fetch(
            "/api/register",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  name,
                  email,
                  password,
                  referral
                })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          showMessage(
            data.error ||
            "Registration failed.",
            true
          );

          return;

        }


        /*
          Registration successful.
          If server sends token,
          user can be logged in directly.
        */

        if (data.token) {

          localStorage.setItem(
            "xenon_token",
            data.token
          );


          showMessage(
            "✅ Account created! Opening shop...",
            false
          );


          setTimeout(
            () => {
              location.href =
                "/shop.html";
            },
            600
          );

        }

        else {

          showMessage(
            "✅ Account created! Login karo.",
            false
          );


          setTimeout(
            () => {
              location.href =
                "/login.html";
            },
            800
          );

        }

      }

      catch (error) {

        console.error(
          error
        );

        showMessage(
          "Server se connection nahi ho raha.",
          true
        );

      }

      finally {

        button.disabled = false;

        button.textContent =
          "CREATE ACCOUNT";

      }

    }


    function showMessage(
      text,
      error
    ) {

      const message =
        document
          .getElementById(
            "message"
          );


      message.style.display =
        "block";


      message.textContent =
        text;


      message.style.color =
        error
          ? "#fb7185"
          : "#4ade80";

    }


    /* Enter key */

    document
      .getElementById(
        "confirmPassword"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
            "Enter"
          ) {

            registerUser();

          }

        }
      );

  </script>

</body>

</html>
