<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wallet • Xenon Shop</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <!-- TOP BAR -->

  <header class="topbar">

    <div class="logo">
      XENON<span>SHOP</span>
    </div>

    <div class="balance">
      ₹<span id="balance">0</span>
    </div>

  </header>


  <!-- MAIN -->

  <main class="container">

    <section class="hero">

      <div class="small-text">
        MY WALLET
      </div>

      <h1>
        ₹<span id="heroBalance">0</span>
      </h1>

      <p>
        Add money to your Xenon wallet.
        Your payment request will be checked
        by the admin.
      </p>

      <button
        class="btn"
        onclick="openAddMoney()"
      >
        + ADD MONEY
      </button>

    </section>


    <!-- PAYMENT STATUS -->

    <h2 class="section-title">
      Payment History
    </h2>

    <div
      id="payments"
    >

      <div class="card">
        Loading payment history...
      </div>

    </div>

  </main>


  <!-- BOTTOM NAV -->

  <nav class="bottom-nav">

    <a href="/shop.html">
      🏠 Shop
    </a>

    <a
      href="/wallet.html"
      class="active"
    >
      💰 Wallet
    </a>

    <a href="/referral.html">
      🎁 Refer
    </a>

    <a href="/profile.html">
      👤 Profile
    </a>

  </nav>


  <!-- ADD MONEY MODAL -->

  <div
    id="moneyModal"
    class="modal"
  >

    <div class="modal-box">

      <button
        class="close"
        onclick="closeAddMoney()"
      >
        ×
      </button>

      <div class="logo">
        XENON<span>WALLET</span>
      </div>

      <h2>
        Add Money
      </h2>

      <p class="small-text">
        Payment karne ke baad UTR/Transaction
        number submit karo.
      </p>


      <!-- UPI INFO -->

      <div
        class="card"
        style="margin:15px 0"
      >

        <div class="small-text">
          UPI ID
        </div>

        <h3 id="upiId">
          Loading...
        </h3>

        <button
          class="btn-secondary"
          onclick="copyUPI()"
        >
          Copy UPI ID
        </button>

      </div>


      <label>
        Amount
      </label>

      <input
        id="amount"
        class="input"
        type="number"
        min="1"
        placeholder="Enter amount"
      >


      <label>
        UTR / Transaction ID
      </label>

      <input
        id="utr"
        class="input"
        type="text"
        placeholder="Enter UTR number"
      >


      <br>

      <button
        id="submitBtn"
        class="btn full"
        onclick="submitPayment()"
      >
        SUBMIT PAYMENT
      </button>


      <p
        id="modalMessage"
        class="small-text"
        style="
          display:none;
          margin-top:14px;
        "
      ></p>

    </div>

  </div>


  <script>

    const token =
      localStorage.getItem(
        "xenon_token"
      );


    /* LOGIN CHECK */

    if (!token) {

      location.href =
        "/login.html";

    }


    const headers = {

      "Authorization":
        "Bearer " + token,

      "Content-Type":
        "application/json"

    };


    /* ---------------- USER ---------------- */

    async function loadUser() {

      try {

        const response =
          await fetch(
            "/api/me",
            {
              headers
            }
          );


        if (!response.ok) {

          localStorage.removeItem(
            "xenon_token"
          );

          location.href =
            "/login.html";

          return;

        }


        const user =
          await response.json();


        const balance =
          Number(
            user.balance || 0
          );


        document
          .getElementById(
            "balance"
          )
          .textContent =
          balance.toFixed(0);


        document
          .getElementById(
            "heroBalance"
          )
          .textContent =
          balance.toFixed(0);

      }

      catch (error) {

        console.error(
          error
        );

      }

    }


    /* ---------------- OPEN MODAL ---------------- */

    function openAddMoney() {

      document
        .getElementById(
          "moneyModal"
        )
        .classList.add(
          "show"
        );

      loadUPI();

    }


    /* ---------------- CLOSE MODAL ---------------- */

    function closeAddMoney() {

      document
        .getElementById(
          "moneyModal"
        )
        .classList.remove(
          "show"
        );

    }


    /* Outside click */

    document
      .getElementById(
        "moneyModal"
      )
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target ===
            this
          ) {

            closeAddMoney();

          }

        }
      );


    /* ---------------- UPI ---------------- */

    async function loadUPI() {

      const box =
        document
          .getElementById(
            "upiId"
          );


      try {

        const response =
          await fetch(
            "/api/config"
          );


        if (
          response.ok
        ) {

          const data =
            await response.json();


          box.textContent =
            data.upiId ||
            "UPI ID unavailable";

        }

        else {

          box.textContent =
            "UPI ID unavailable";

        }

      }

      catch (error) {

        box.textContent =
          "UPI ID unavailable";

      }

    }


    /* ---------------- COPY UPI ---------------- */

    async function copyUPI() {

      const upi =
        document
          .getElementById(
            "upiId"
          )
          .textContent;


      if (
        !upi ||
        upi.includes(
          "unavailable"
        )
      ) {

        return;

      }


      try {

        await navigator
          .clipboard
          .writeText(
            upi
          );


        alert(
          "✅ UPI ID copied"
        );

      }

      catch (error) {

        alert(
          "UPI ID: " +
          upi
        );

      }

    }


    /* ---------------- SUBMIT PAYMENT ---------------- */

    async function submitPayment() {

      const amount =
        Number(
          document
            .getElementById(
              "amount"
            )
            .value
        );


      const utr =
        document
          .getElementById(
            "utr"
          )
          .value
          .trim();


      const button =
        document
          .getElementById(
            "submitBtn"
          );


      const message =
        document
          .getElementById(
            "modalMessage"
          );


      if (
        !amount ||
        amount <= 0
      ) {

        showModalMessage(
          "Valid amount enter karo.",
          true
        );

        return;

      }


      if (!utr) {

        showModalMessage(
          "UTR / Transaction ID enter karo.",
          true
        );

        return;

      }


      button.disabled =
        true;

      button.textContent =
        "SUBMITTING...";


      try {

        const response =
          await fetch(
            "/api/deposits",
            {
              method: "POST",

              headers,

              body:
                JSON.stringify({
                  amount,
                  utr
                })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          showModalMessage(
            data.error ||
            "Payment submit nahi hua.",
            true
          );

          return;

        }
