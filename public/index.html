<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Xenon Shop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#070914;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

#authPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.authBox{
  width:100%;
  max-width:430px;
  background:#111528;
  border:1px solid #2b3150;
  border-radius:25px;
  padding:28px;
  box-shadow:0 20px 60px #0008;
}

.logo{
  font-size:30px;
  font-weight:900;
}

.logo span{
  color:#8b63ff;
}

.authBox h1{
  margin-top:35px;
  font-size:38px;
}

.sub{
  color:#9299ad;
  margin:10px 0 25px;
}

label{
  display:block;
  color:#aeb5ca;
  margin:15px 0 7px;
}

input,textarea{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid #303650;
  background:#080b15;
  color:white;
  outline:none;
}

input:focus,textarea:focus{
  border-color:#8061ff;
}

.btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:12px;
  background:#7657ff;
  color:white;
  font-weight:800;
}

.btn.secondary{
  background:#20263b;
}

.switch{
  text-align:center;
  margin-top:20px;
  color:#a992ff;
  cursor:pointer;
}

/* APP */

#app{
  min-height:100vh;
  padding-bottom:85px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:5;
  background:#090b17ee;
  backdrop-filter:blur(15px);
  border-bottom:1px solid #202640;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#7657ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.container{
  max-width:760px;
  margin:auto;
  padding:20px;
}

.hero{
  padding:25px 0;
}

.hero small{
  color:#a78fff;
  font-weight:bold;
}

.hero h1{
  font-size:40px;
  margin:12px 0;
}

.hero h1 span{
  color:#916cff;
}

.hero p{
  color:#9198ad;
}

/* WALLET */

.wallet{
  background:linear-gradient(135deg,#7657ff,#40257e);
  border-radius:22px;
  padding:22px;
  margin:15px 0 28px;
}

.wallet small{
  color:#ddd4ff;
}

.balance{
  font-size:36px;
  font-weight:900;
  margin:10px 0 18px;
}

.row{
  display:flex;
  gap:10px;
}

.row .btn{
  margin:0;
}

/* PRODUCTS */

.sectionTitle{
  margin:20px 0 15px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.card{
  background:#111528;
  border:1px solid #292f4b;
  border-radius:20px;
  padding:17px;
}

.productIcon{
  font-size:35px;
}

.card h3{
  margin:10px 0;
}

.description{
  color:#8e96ac;
  font-size:14px;
  min-height:38px;
}

.price{
  font-size:20px;
  font-weight:900;
  margin-top:12px;
}

.card .btn{
  margin-top:12px;
}

/* PAGES */

.page{
  display:none;
}

.page.active{
  display:block;
}

.pageTitle{
  font-size:28px;
  margin:15px 0 20px;
}

/* REFER */

.referBox{
  text-align:center;
  padding:28px;
}

.referIcon{
  font-size:55px;
}

.refCode{
  background:#080b15;
  border:1px dashed #7657ff;
  border-radius:14px;
  padding:16px;
  margin:20px 0;
  font-size:20px;
  font-weight:bold;
}

/* HISTORY */

.historyItem{
  padding:15px 0;
  border-bottom:1px solid #292f4b;
}

.status{
  display:inline-block;
  margin-top:7px;
  padding:5px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.pending{
  background:#55420d;
}

.accepted{
  background:#10452b;
}

.rejected{
  background:#541a27;
}

/* PROFILE */

.profileCard{
  text-align:center;
}

.profileAvatar{
  width:80px;
  height:80px;
  border-radius:50%;
  background:#7657ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
  margin:0 auto 15px;
}

.info{
  text-align:left;
  margin-top:20px;
}

.info div{
  padding:13px 0;
  border-bottom:1px solid #292f4b;
}

.info span{
  color:#858da4;
}

/* BOTTOM */

.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  max-width:760px;
  margin:auto;
  background:#0d1020;
  border-top:1px solid #292f4b;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:10;
}

.navBtn{
  border:0;
  background:transparent;
  color:#7e879e;
  font-size:11px;
}

.navBtn b{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.navBtn.active{
  color:#a88fff;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:50;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modalBox{
  width:100%;
  max-width:760px;
  background:#111528;
  border-radius:25px 25px 0 0;
  padding:22px;
  max-height:90vh;
  overflow:auto;
}

.close{
  float:right;
  background:#252b40;
  border:0;
  color:#fff;
  width:38px;
  height:38px;
  border-radius:12px;
  font-size:22px;
}

/* ADMIN */

.adminItem{
  padding:15px 0;
  border-bottom:1px solid #292f4b;
}

@media(max-width:520px){
  .products{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:34px;
  }

  .row{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<!-- LOGIN / REGISTER -->

<div id="authPage">

  <div class="authBox">

    <div class="logo">
      XENON<span>SHOP</span>
    </div>

    <!-- LOGIN -->

    <div id="loginBox">

      <h1>Welcome Back</h1>

      <p class="sub">
        Login to your Xenon Shop
