<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Profile • Xenon Shop</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <header class="topbar">

    <div class="logo">
      XENON<span>SHOP</span>
    </div>

    <div class="balance">
      ₹<span id="balance">0</span>
    </div>

  </header>


  <main class="container">

    <section class="hero">

      <div class="profile-avatar">
        👤
      </div>

      <h1 id="name">
        Loading...
      </h1>

      <p id="email">
        Loading...
      </p>

    </section>


    <h2 class="section-title">
      Account
    </h2>


    <div class="card">

      <div class="profile-row">

        <div>
          <div class="small-text">
            Name
          </div>

          <b id="profileName">
            -
          </b>
        </div>

      </div>


      <div class="profile-row">

        <div>
          <div class="small-text">
            Email
          </div>

          <b id="profileEmail">
            -
          </b>
        </div>

      </div>


      <div class="profile-row">

        <div>
          <div class="small-text">
            Wallet Balance
          </div>

          <b>
            ₹<span id="profileBalance">
              0
            </span>
          </b>
        </div>

      </div>


      <div class="profile-row">

        <div>
          <div class="small-text">
            Referral Code
          </div>

          <b id="profileReferral">
            -
          </b>
        </div>

      </div>

    </div>


    <h2 class="section-title">
      Quick Actions
    </h2>


    <div class="grid">

      <a
        href="/shop.html"
        class="card action-card"
      >

        <div class="product-icon">
          🛍️
        </div>

        <h3>
          Shop
        </h3>

        <p class="small-text">
          Browse products
        </p>

      </a>


      <a
        href="/wallet.html"
        class="card action-card"
      >

        <div class="product-icon">
          💰
        </div>

        <h3>
          Wallet
        </h3>

        <p class="small-text">
          Add money
        </p>

      </a>


      <a
        href="/referral.html"
        class="card action-card"
      >

        <div class="product-icon">
          🎁
        </div>

        <h3>
          Refer
        </h3>

        <p class="small-text">
          Refer & earn
        </p>

      </a>

    </div>


    <button
      class="btn full logout"
      onclick="logout()"
    >
      LOGOUT
    </button>

  </main>


  <nav class="bottom-nav">

    <a href="/shop.html">
      🏠 Shop
    </a>

    <a href="/wallet.html">
      💰 Wallet
    </a>

    <a href="/referral.html">
      🎁 Refer
    </a>

    <a
      href="/profile.html"
      class="active"
    >
      👤 Profile
    </a>

  </nav>


  <script>

    const token =
      localStorage.getItem(
        "xenon_token"
      );


    if (!token) {

      location.href =
        "/login.html";

    }


    async function loadProfile() {

      try {

        const response =
          await fetch(
            "/api/me",
            {
              headers: {
                "Authorization":
                  "Bearer " + token
              }
            }
          );


        if (!response.ok) {

          localStorage.removeItem(
            "xenon_token"
          );

          location.href =
            "/login.html";

          return;

        }


        const user =
          await response.json();


        const balance =
          Number(
            user.balance || 0
          ).toFixed(0);


        const name =
          user.name ||
          "User";


        const email =
          user.email ||
          "-";


        const referral =
          user.referralCode ||
          user.referral ||
          "-";


        document
          .getElementById(
            "name"
          )
          .textContent =
          name;


        document
          .getElementById(
            "email"
          )
          .textContent =
          email;


        document
          .getElementById(
            "balance"
          )
          .textContent =
          balance;


        document
          .getElementById(
            "profileName"
          )
          .textContent =
          name;


        document
          .getElementById(
            "profileEmail"
          )
          .textContent =
          email;


        document
          .getElementById(
            "profileBalance"
          )
          .textContent =
          balance;


        document
          .getElementById(
            "profileReferral"
          )
          .textContent =
          referral;

      }

      catch (error) {

        console.error(
          error
        );

      }

    }


    function logout() {

      const confirmLogout =
        confirm(
          "Kya aap logout karna chahte ho?"
        );


      if (!confirmLogout) {

        return;

      }


      localStorage.removeItem(
        "xenon_token"
      );


      location.href =
        "/login.html";

    }


    loadProfile();

  </script>

</body>

</html>
