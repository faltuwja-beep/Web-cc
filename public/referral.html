<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Refer & Earn • Xenon Shop</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <header class="topbar">

    <div class="logo">
      XENON<span>SHOP</span>
    </div>

    <div class="balance">
      ₹<span id="balance">0</span>
    </div>

  </header>


  <main class="container">

    <section class="hero">

      <div class="small-text">
        XENON REWARDS
      </div>

      <h1>
        Refer & Earn 🎁
      </h1>

      <p>
        Apna referral code friends ke saath
        share karo.
      </p>

    </section>


    <h2 class="section-title">
      Your Referral
    </h2>

    <div class="card">

      <div class="small-text">
        YOUR REFERRAL CODE
      </div>

      <h1 id="referralCode">
        Loading...
      </h1>

      <button
        class="btn"
        onclick="copyCode()"
      >
        COPY CODE
      </button>

      <button
        class="btn-secondary"
        onclick="shareReferral()"
        style="margin-left:8px"
      >
        SHARE
      </button>

    </div>


    <h2 class="section-title">
      Referral Link
    </h2>

    <div class="card">

      <input
        id="referralLink"
        class="input"
        readonly
      >

      <br><br>

      <button
        class="btn full"
        onclick="copyLink()"
      >
        COPY REFERRAL LINK
      </button>

    </div>


    <h2 class="section-title">
      Referral Stats
    </h2>

    <div class="grid">

      <div class="card">

        <div class="small-text">
          TOTAL REFERRALS
        </div>

        <div
          id="referralCount"
          class="price"
        >
          0
        </div>

      </div>


      <div class="card">

        <div class="small-text">
          REFERRAL EARNINGS
        </div>

        <div
          id="referralEarnings"
          class="price"
        >
          ₹0
        </div>

      </div>

    </div>

  </main>


  <nav class="bottom-nav">

    <a href="/shop.html">
      🏠 Shop
    </a>

    <a href="/wallet.html">
      💰 Wallet
    </a>

    <a
      href="/referral.html"
      class="active"
    >
      🎁 Refer
    </a>

    <a href="/profile.html">
      👤 Profile
    </a>

  </nav>


  <script>

    const token =
      localStorage.getItem(
        "xenon_token"
      );


    if (!token) {

      location.href =
        "/login.html";

    }


    const headers = {

      "Authorization":
        "Bearer " + token

    };


    async function loadReferral() {

      try {

        const response =
          await fetch(
            "/api/me",
            {
              headers
            }
          );


        if (!response.ok) {

          localStorage.removeItem(
            "xenon_token"
          );

          location.href =
            "/login.html";

          return;

        }


        const user =
          await response.json();


        document
          .getElementById(
            "balance"
          )
          .textContent =
          Number(
            user.balance || 0
          ).toFixed(0);


        const code =
          user.referralCode ||
          user.referral ||
          "N/A";


        document
          .getElementById(
            "referralCode"
          )
          .textContent =
          code;


        const link =
          window.location.origin +
          "/register.html?ref=" +
          encodeURIComponent(
            code
          );


        document
          .getElementById(
            "referralLink"
          )
          .value =
          link;


        document
          .getElementById(
            "referralCount"
          )
          .textContent =
          Number(
            user.referralCount || 0
          );


        document
          .getElementById(
            "referralEarnings"
          )
          .textContent =
          "₹" +
          Number(
            user.referralEarnings || 0
          );

      }

      catch (error) {

        console.error(error);

      }

    }


    async function copyCode() {

      const code =
        document
          .getElementById(
            "referralCode"
          )
          .textContent;


      if (!code || code === "N/A") {

        return;

      }


      try {

        await navigator
          .clipboard
          .writeText(code);

        alert(
          "✅ Referral code copied"
        );

      }

      catch (error) {

        alert(
          "Referral Code: " + code
        );

      }

    }


    async function copyLink() {

      const input =
        document
          .getElementById(
            "referralLink"
          );


      try {

        await navigator
          .clipboard
          .writeText(
            input.value
          );

        alert(
          "✅ Referral link copied"
        );

      }

      catch (error) {

        input.select();

        document.execCommand(
          "copy"
        );

        alert(
          "✅ Referral link copied"
        );

      }

    }


    async function shareReferral() {

      const link =
        document
          .getElementById(
            "referralLink"
          )
          .value;


      const text =
        "Join me on Xenon Shop 🎁\n" +
        link;


      if (
        navigator.share
      ) {

        try {

          await navigator.share({
            title:
              "Xenon Shop",
            text
          });

        }

        catch (error) {}

      }

      else {

        await copyLink();

      }

    }


    loadReferral();

  </script>

</body>

</html>
